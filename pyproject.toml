[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "candor-memory"
version = "2.0.0"
description = "Point-in-time workplace memory (passage-level retrieval) and a dry-run action planner"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Rajeev Karakoti", email = "rajeevkarakoti04@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.scripts]
candor = "candor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
